[package]
name = "forge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ForgeHub CLI (binary `forgehub`, aliased to `fg`)."

[[bin]]
name = "forgehub"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
forge-core = { version = "0.1.0", path = "../forge-core" }
# OS keyring for credential storage (2026-11-20): Keychain on
# macOS, Credential Manager on Windows. Only cloud commands
# touch it, and an unreachable keyring falls back to the
# credentials file (see cloud.rs). The Linux secret-service
# backend is the `linux-keyring` feature below, not a default:
# it links the system D-Bus library, which would break the
# static musl release binaries and headless builds.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
regex = "1"
# TUI (Step 18): ratatui rendering over crossterm; only the
# `ui` command constructs them, so other commands pay nothing.
ratatui = "0.29"
crossterm = "0.28"
# Cloud commands only (Step 11): reqwest is constructed lazily by
# `login`/`logout`/`whoami`/cloud doctor checks, so local commands
# never pay its runtime cost; rustls avoids a system OpenSSL
# dependency. Proxy env vars (HTTP_PROXY/HTTPS_PROXY/NO_PROXY) are
# honoured by reqwest's default system-proxy behaviour. Roots are
# the OS trust store (rustls-native-certs), NOT webpki-roots:
# ForgeHub is self-hosted, so servers legitimately present
# certificates from private/local CAs (e.g. Caddy's local CA on
# https://localhost) that only the system store can vouch for -
# the CLI must trust what the OS trusts, like curl and git do.
# (With webpki-roots, `fg login` against https://localhost
# failed TLS even after the CA was installed system-wide;
# found in local testing, 2026-11-19.)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
similar = "2"
toml = "0.8"
clap_mangen = "0.3.4"

[features]
# Linux OS-keyring support via D-Bus secret-service (GNOME
# Keyring / KWallet). Requires libdbus-1-dev at build time and
# a running secret service at run time; without it, Linux
# builds use the credentials file (which auto mode falls back
# to on every platform when no keyring answers).
linux-keyring = ["keyring/sync-secret-service"]

[dev-dependencies]
# Integration tests drive the real server in-process (Step 11).
axum = "0.8"
clap_mangen = "0.3.4"
forge-server = { version = "0.1.0", path = "../forge-server" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

# .deb packaging (Step 21): `cargo install cargo-deb` then
# `cargo deb -p forge-cli` produces a Debian package locally.
# Template only - nothing is published from the repo.
[package.metadata.deb]
maintainer = "Aotlover9 <nikhilbhaiop77@gmail.com>"
copyright = "2026, Aotlover9"
license-file = ["../../LICENSE", "0"]
extended-description = "ForgeHub is a cloud home for shell command snippets. Save a command once, run it anywhere with fg."
section = "utils"
priority = "optional"
assets = [
    ["target/release/forgehub", "usr/bin/", "755"],
    ["../../docs/man/*.1", "usr/share/man/man1/", "644"],
    ["../../LICENSE", "usr/share/doc/forgehub/LICENSE", "644"],
]
