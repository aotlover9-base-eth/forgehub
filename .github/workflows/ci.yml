name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal permissions (Step 19): every job only reads the
# repo (Step 22: the audit action that needed checks:write
# was replaced by a direct cargo audit run).
permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (Step 19, T-SUPPLY);
      # the trailing comment is the human-readable version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Vitest 5's worker pool does not start on Node 20
          # ("Failed to start forks worker … reading 'bind'",
          # first CI run 44482326352); the suite is developed and
          # green on Node 24.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test -- --run
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (real server + real CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps (for the SPA build the server hosts)
        working-directory: web
        run: npm ci --legacy-peer-deps
      - name: Run the end-to-end story
        run: bash scripts/e2e.sh
      - name: Install the headless browser
        working-directory: web
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Run the browser end-to-end story
        run: bash scripts/e2e-web.sh --skip-build

  docker:
    name: Docker (image build + boot smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the image
        run: docker build -t forgehub:ci --build-arg GIT_SHA=${{ github.sha }} .
      # The gap this closes (docs/known-gaps.md): until now CI
      # never built the image, so a broken docker-compose /
      # Dockerfile / runtime-env combination could ship green
      # — and did (the v0.1.0 compose file carried a literal
      # placeholder as its database URL and crash-looped on
      # first real use). Booting the image and demanding a
      # healthy response plus a real signup exercises the
      # migrations, the database and the API inside the exact
      # artifact users run.
      - name: Boot it and demand health + a working signup
        run: |
          docker run -d --name forgehub-ci -p 8080:8080 \
            -e FORGEHUB_SECRET_KEY=ci-smoke-secret-key-that-is-long-enough-0123456789 \
            forgehub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then
              echo "healthy after ${i} tries"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "server never became healthy; logs:"
              docker logs forgehub-ci
              exit 1
            fi
            sleep 2
          done
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-smoke","email":"ci@forgehub.dev","password":"ci-smoke-pass-12345"}'
          echo "signup inside the image works"
      - name: Show logs on failure
        if: failure()
        run: docker logs forgehub-ci || true

  supply-chain:
    name: Supply chain (deny, audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: cargo deny (advisories, licences, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
        with:
          command: check
      # cargo audit runs directly (Step 22): the audit-check
      # action's check-run update call 404'd on the Step 21
      # run and failed the job despite "No vulnerabilities
      # were found". The binary's own exit code is the gate:
      # it fails on vulnerabilities, not on the informational
      # warnings that cargo deny already governs via deny.toml.
      - name: Install cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm audit (production deps)
        working-directory: web
        run: |
          npm ci --legacy-peer-deps
          npm audit --omit=dev
