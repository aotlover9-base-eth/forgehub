name: Release binaries

# Builds the CLI for every supported target when a version
# tag is pushed, and uploads the assets as a workflow
# artifact. It deliberately does NOT create a GitHub Release:
# publishing is a separate human step (see docs/adr/0008 and
# the commands in reports/report_Step22.md), so a tag can
# never become a public release by accident.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          # No macOS legs (user decision, 2026-11-20): ForgeHub
          # ships Linux + Windows binaries; macOS Actions
          # minutes on a private repo cost money the project
          # does not spend. macOS users build from source.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools (x86_64 musl leg)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross (aarch64 musl leg)
        if: matrix.cross
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          # Reproducible build date: the tagged commit's date,
          # so --version reports the release date, not the
          # runner's clock.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release -p forge-cli --target ${{ matrix.target }}
          else
            cargo build --release -p forge-cli --target ${{ matrix.target }}
          fi
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="forgehub-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/forgehub" "dist/$name/"
          strip "dist/$name/forgehub" || true
          cp LICENSE README.md "dist/$name/"
          mkdir -p "dist/$name/man"
          cp docs/man/*.1 "dist/$name/man/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "forgehub-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/forgehub.exe" "dist/$name/"
          Copy-Item LICENSE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
          # The bare .exe ships too (owner request, 2026-11-20):
          # Windows users should not have to unzip anything to
          # get the binary. Same bytes as inside the zip.
          Copy-Item "dist/$name/forgehub.exe" "dist/$name.exe"
          $exeHash = (Get-FileHash "dist/$name.exe" -Algorithm SHA256).Hash.ToLower()
          "$exeHash  $name.exe" | Out-File -Encoding ascii "dist/$name.exe.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forgehub-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  package:
    name: Collect assets + checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          pattern: forgehub-*
          merge-multiple: true
      - name: Build the combined SHA256SUMS
        run: |
          cd assets
          cat -- *.sha256 > SHA256SUMS
          rm -- *.sha256
          cat SHA256SUMS
      # No build-provenance attestation step: GitHub does not
      # offer attestations for user-owned private repositories
      # (the v0.1.3 run failed on exactly this), and making the
      # repo public for it is not the project's call to make
      # silently. SHA256SUMS is the integrity contract;
      # install.sh verifies against it.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ github.ref_name }}
          path: assets/*
          if-no-files-found: error
